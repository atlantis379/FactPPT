<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sol / Luna 前10页视觉设计对照</title><link rel="stylesheet" href="/web/vendor/tabler/tabler.min.css"><body><main class="container-xl py-4"><h1>前10页视觉设计对照</h1><p>同一内容、同一教学模板、同一生图工具。两组独立决定构图和提示词。生成文字仅为设计参考，原生交付使用锁定文本。</p><div class="alert alert-info">设计稿与提示词分别呈现。未返回图片的调用明确标为未生成，连接失败不计为模型设计质量差异。单次实测含生图随机性，不能单独证明因果。</div><div id="status" class="mb-3"></div><div id="pages"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const m=await(await fetch('manifest.json?v='+Date.now(),{cache:'no-store'})).json();document.querySelector('#status').textContent=['sol','luna'].map(a=>`${a==='sol'?'Sol':'Luna'}：${m.arms[a].filter(r=>r.preview).length}/10 页有实际图片`).join(' · ');document.querySelector('#pages').innerHTML=m.pages.map(p=>`<section class="mb-4"><h2>第${p.number}页 · ${esc(p.title||p.id)}</h2><div class="row g-3">${['sol','luna'].map(a=>{const r=m.arms[a].find(r=>r.page===p.number)||{};return `<div class="col-md-6"><div class="card"><div class="card-header"><b>${a==='sol'?'Sol':'Luna'}</b><span class="badge bg-secondary-lt ms-2">${esc(/revision_required/i.test(r.status||"")?"初稿需修订":r.preview?"已生成 · 待选择":"待生成")}</span></div><div class="card-body">${r.preview?`<a href="${esc(r.preview)}" target="_blank"><img style="width:100%" src="${esc(r.preview)}" alt="第${p.number}页 ${a} 实际设计稿"></a>`:'<div class="alert alert-warning">尚无实际设计图片</div>'}<div class="small text-secondary mt-2">实际检查：${esc(typeof r.inspection==="string"?r.inspection:r.inspection?.visual_notes||"尚未完成检查")}</div><p class="mt-2">${esc(r['方案']||r.design||r.status||'等待执行')}</p><details><summary>查看完整提示词与执行记录</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(r.prompt)}</pre><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify({status:r.status,visual_parts:r.visual_parts,inspection:r.inspection,calls:r.calls,retry_records:r.retry_records},null,2))}</pre></details></div></div></div>`}).join('')}</div></section>`).join('')};load();setInterval(load,30000);
</script></body></html>
