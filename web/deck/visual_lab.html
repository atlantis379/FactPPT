<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luna图解方案实测</title><link rel="stylesheet" href="/web/vendor/tabler/tabler.min.css">
<body><main class="container-xl py-4">
<h1>Luna图解方案实测</h1><p class="text-secondary">同一内容与教学配色，比较教材结构图、期刊信息图和场景教学图。所有画面来自真实生图；检查完成不代表交付通过。</p>
<div class="card mb-3"><div class="card-body"><b>当前进度与下一步</b><p id="progress" class="mt-2 mb-1">正在加载实际记录…</p><div class="text-secondary">九稿比较 → 稳定性验证 → 封面／表格／关系页 → 六页原生PPT核对 → 你确认视觉标准</div></div></div>
<div class="alert alert-info" id="notice">正在制作和检查。请对照图形是否解释了内容、主焦点、阅读顺序与可读性。</div>
<div class="card mb-3"><div class="card-body"><label class="form-label" for="preference">我的偏好与修改建议</label><textarea class="form-control" id="preference" rows="2" placeholder="例如：喜欢期刊式，但诊断页需要更清楚地展示条件"></textarea><button id="save" class="btn mt-2">保存偏好到本机浏览器</button><span id="saved" class="ms-2 text-secondary"></span></div></div>
<div class="btn-list mb-3" id="filters"><button class="btn btn-primary" data-phase="screen">首轮9张</button><button class="btn" data-phase="quality">针对性修订</button><button class="btn" data-phase="stability">稳定性</button><button class="btn" data-phase="extension">扩展样本</button></div>
<div id="native" class="mb-4"></div><div id="gallery"></div><div id="review" class="mt-4"></div>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let phase='screen',manifest=null;
const name={textbook:'教材式结构图',editorial:'期刊式信息图',scenario:'场景式教学插画'};
const issueName={UNSOURCED_MEDICAL_MEANING:'新增了来源没有的医学说明',UNSOURCED_CURVE_AXES:'出现无来源数据的坐标曲线',UNSUPPORTED_CROSS_SCOPE_RELATION:'出现来源未支持的跨范围关系'};
function render(){if(!manifest)return;const rows=manifest.trials.filter(t=>t.phase===phase);const ready=manifest.trials.filter(t=>t.preview).length;document.querySelector('#progress').textContent=`已保存 ${ready} 张实际设计图；设计调用 ${manifest.actual_calls} 次；去字稿 ${manifest.clean_images??0}/6，实际矢量文件 ${manifest.vector_assets??0}/6。视觉标准待你确认。`;
 const native=manifest.native_preview;
 if(native && manifest.selection) document.querySelector('#native').insertAdjacentHTML('beforebegin','<div class="alert alert-info">左栏保存的是生成过程原稿，可能包含已移除的无来源内容；最终内容与关系请核对右栏原生PowerPoint画面。</div>');
 document.querySelector('#notice').textContent=native?.style_confirmed?'当前六页教材式视觉标准 v1 已由用户确认并冻结；修改绑定输入或画面后需重新确认。':manifest.selection?.preferred_strategy==='textbook'?(native?.label==='教材式原生样稿'?(native.ready_for_human_style_review?'教材式六页原生样稿已完成并检查，请查看实际画面。':'教材式原生导出已完成，正在检查实际画面。'):'已选择教材式结构，正在补齐六页原生样稿。追加3次设计调用已记录；下方期刊式是上一版对照。'):native?.ready_for_human_style_review?'制作和检查已完成。现在由你查看六页实际PPT并给出视觉偏好；在对话中回复是否采用期刊式。浏览器保存偏好只作草稿记录，正式视觉确认尚未记录。':'系统正在制作或检查，无需重复提交；可以先浏览历史方案。';
 document.querySelector('#native').innerHTML=native?`<div class="card"><div class="card-body"><h2>${esc(native.label??'六页原生PPT实际画面')}</h2><p>${native.style_confirmed?'六页教材式视觉标准 v1 已确认，当前画面及重建规则已归档。':native.ready_for_human_style_review?'由你查看与确认视觉标准：比较焦点、阅读顺序、密度与一致性，再在上方填写偏好或在对话中回复。':'原生导出已完成，局部画面复核中。'}</p><p>字体与生成图有差异，纸张纹理和部分渐变有所损失；请以右栏PowerPoint画面判断。</p><div class="btn-list mb-3"><a class="btn btn-primary" href="${esc(native.pptx)}">下载六页原生PPT</a><a class="btn" href="${esc(native.pdf)}" target="_blank">查看PDF</a><a class="btn" href="${esc(native.report)}" target="_blank">实测报告</a></div>${native.pages.map(p=>`<h3>原第${p.page}页</h3><div class="row g-3 mb-4">${[['完整设计图',p.design],['浏览器原生预览',p.browser],['PowerPoint实际画面',p.powerpoint]].map(([label,url])=>`<div class="col-md-4"><b>${esc(label)}</b><a href="${esc(url)}" target="_blank"><img loading="lazy" src="${esc(url)}" style="width:100%" alt="${esc(label)}原第${p.page}页"></a></div>`).join('')}</div>`).join('')}<p class="text-secondary">原生路径 ${native.verification.native_paths}；生成图片对象 ${native.verification.generated_picture_objects}；${native.style_confirmed?'人工视觉确认已记录。':'人工视觉确认尚未记录。'}</p></div></div>`:'';
 const pages=[...new Set(rows.map(t=>t.page))].sort((a,b)=>a-b);document.querySelector('#gallery').innerHTML=pages.length?pages.map(n=>`<section class="mb-4"><h2>原第${n}页</h2><div class="row g-3">${rows.filter(t=>t.page===n).map(t=>`<div class="col-md-4"><div class="card"><div class="card-header"><b>${esc(name[t.strategy])}</b><span class="badge bg-secondary-lt ms-2">${t.preview?'已生成 · 待评选':t.status==='CALL_ISSUED'?'调用已安排':'待生成'}</span></div><div class="card-body">${t.preview?`<a href="${esc(t.preview)}" target="_blank"><img src="${esc(t.preview)}" style="width:100%" alt="${esc(t.name)}第${n}页实际图片"></a>`:'<div class="alert alert-warning">尚无实际图片</div>'}${t.issues?.length?`<div class="alert alert-warning mt-2 mb-2"><b>已发现的问题</b><ul class="mb-0">${t.issues.map(x=>`<li>${esc(typeof x==='string'?x:JSON.stringify(x))}</li>`).join('')}</ul></div>`:''}<details class="mt-2"><summary>查看实际检查及提示词</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(typeof t.inspection==='string'?t.inspection:JSON.stringify(t.inspection,null,2))}</pre>${t.prompt_url?`<a href="${esc(t.prompt_url)}" target="_blank">完整调用提示词</a>`:''}<p class="small mt-2">实际记录 ${t.calls} 次；外层等待 ${t.outer_wait_seconds??'未记录'} 秒；厂商费用未取得。</p></details></div></div></div>`).join('')}</div></section>`).join(''):'<div class="card"><div class="card-body">本阶段尚未开始。完成前一阶段检查后继续。</div></div>';
 const review=manifest.reviews?.[phase]??(phase==='screen'?manifest.review:null);
 document.querySelector('#review').innerHTML=review?`<div class="card"><div class="card-body"><h2>本阶段独立复核与候选建议</h2>${phase==='stability'?`<div class="alert alert-warning">${review.provisional_winner?'临时候选：'+esc(name[review.provisional_winner]):'尚无方案通过准确性门槛，正在修订。'}<ul class="mb-0">${(review.findings??[]).map(f=>`<li>${esc(issueName[f.id]??f.id)}</li>`).join('')}</ul></div>`:''}<p class="text-secondary">候选建议用于继续实测；最终视觉标准由你确认。</p><details><summary>查看逐项复核记录</summary><pre style="white-space:pre-wrap">${esc(JSON.stringify(review,null,2))}</pre></details></div></div>`:'';
}
async function load(){try{manifest=await(await fetch('manifest.json?v='+Date.now(),{cache:'no-store'})).json();render()}catch(e){document.querySelector('#progress').textContent='记录加载失败，请稍后刷新。'}}
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=b.dataset.phase;document.querySelectorAll('[data-phase]').forEach(x=>x.classList.toggle('btn-primary',x===b));render()});
const key='factdeck-visual-prompt-lab-preference';document.querySelector('#preference').value=localStorage.getItem(key)||'';document.querySelector('#save').onclick=()=>{localStorage.setItem(key,document.querySelector('#preference').value);document.querySelector('#saved').textContent='偏好已保存在此浏览器'};
load();setInterval(load,30000);
</script></body></html>
