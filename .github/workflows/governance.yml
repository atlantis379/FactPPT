name: governance
on:
  pull_request:
  push:
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance unit tests
        run: python -m unittest discover -s tests/governance -v
      - name: Frozen contract and milestone gate
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            python tools/governance/check.py --base "origin/${{ github.base_ref }}"
          else
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              if [[ "$(git rev-list --count HEAD)" == "1" ]]; then
                python tools/governance/check.py --initial-baseline
              elif [[ "$PUSH_BRANCH" != "$DEFAULT_BRANCH" ]]; then
                git fetch origin "$DEFAULT_BRANCH"
                python tools/governance/check.py --base "origin/$DEFAULT_BRANCH"
              else
                echo "Cannot establish a safe baseline for a new default branch; open a PR." >&2
                exit 1
              fi
            else
              git fetch origin "$PUSH_BEFORE"
              python tools/governance/check.py --base "$PUSH_BEFORE"
            fi
          fi
