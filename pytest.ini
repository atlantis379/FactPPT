[pytest]
# One entry point for the whole repository: `python -m pytest`.
# `app/` and `tests/` are both test roots, and neither is excluded by the other's
# configuration. `app/validation` is excluded because it is a working area -- it holds
# rendered evidence, vendored node_modules trees, and one-off drivers, not the suite.
testpaths = app tests
norecursedirs = .* tmp pytest_temp* test_tmp_integrity pytest-cache-files-* docs samples skills node_modules
    app/validation app/.codex_build
addopts = -ra -p no:cacheprovider
